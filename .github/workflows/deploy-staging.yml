# Tự động cập nhật site staging khi develop có commit mới và CI xanh.
# Secrets cần đặt trong repo: STAGING_HOST, STAGING_USER, STAGING_SSH_KEY, STAGING_SITE, STAGING_BENCH_DIR
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Cập nhật app trên staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.STAGING_BENCH_DIR }}
            bench --site ${{ secrets.STAGING_SITE }} backup
            cd apps/normcore && git fetch origin develop && git checkout -q develop && git reset -q --hard origin/develop && cd ../..
            bench --site ${{ secrets.STAGING_SITE }} migrate
            bench build --app normcore
            bench --site ${{ secrets.STAGING_SITE }} clear-cache
            sudo -n supervisorctl restart all || bench restart
